<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440,height=280">
  <title>Usage Pacer small promo tile</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Avenir Next", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 440px;
      height: 280px;
      overflow: hidden;
      color: #f4f4f0;
      background: #070908;
    }
    .tile {
      position: relative;
      width: 440px;
      height: 280px;
      overflow: hidden;
      padding: 28px 30px;
      background:
        radial-gradient(circle at 82% 12%, rgba(70, 171, 91, .34), transparent 34%),
        linear-gradient(135deg, #0a110d, #070908 62%);
    }
    .eyebrow {
      color: #63c271;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      width: 220px;
      margin: 15px 0 8px;
      font-size: 29px;
      line-height: .98;
      letter-spacing: -.05em;
    }
    p {
      width: 190px;
      margin: 0;
      color: #a8ada8;
      font-size: 12px;
      line-height: 1.45;
    }
    .mini-card {
      position: absolute;
      right: 22px;
      bottom: 22px;
      width: 164px;
      padding: 12px;
      border: 1px solid #354339;
      border-radius: 17px;
      background: rgba(16, 21, 18, .94);
      box-shadow: 0 18px 35px rgba(0, 0, 0, .42);
    }
    .pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pill {
      min-height: 46px;
      padding: 8px;
      border-radius: 10px;
    }
    .pill.elapsed { color: #0b0b0b; background: #3d9a4a; }
    .pill.used { background: #5a6b3a; }
    .label {
      display: block;
      font-size: 7px;
      font-weight: 800;
      letter-spacing: .1em;
      opacity: .72;
      text-transform: uppercase;
    }
    .value {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.05em;
    }
    .pace {
      margin-top: 10px;
      color: #63c271;
      font-size: 10px;
      font-weight: 750;
    }
    .ring {
      position: absolute;
      left: 188px;
      bottom: -120px;
      width: 245px;
      height: 245px;
      border: 13px solid #1c261e;
      border-right-color: #3d9a4a;
      border-top-color: #3d9a4a;
      border-radius: 50%;
      opacity: .26;
      transform: rotate(24deg);
    }
  </style>
</head>
<body>
  <main class="tile">
    <div class="eyebrow">Usage Pacer · for Cursor</div>
    <h1>Stay ahead of your usage.</h1>
    <p>A quiet signal for your billing cycle, right in the toolbar.</p>
    <div class="mini-card">
      <div class="pills">
        <div class="pill elapsed"><span class="label">Elapsed</span><span class="value">92.4%</span></div>
        <div class="pill used"><span class="label">Used</span><span class="value">66%</span></div>
      </div>
      <div class="pace">Healthy pace</div>
    </div>
    <div class="ring"></div>
  </main>
</body>
</html>
